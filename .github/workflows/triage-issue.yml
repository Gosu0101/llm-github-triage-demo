name: 이슈 트리아지

# 새 이슈가 열리면 분류 → (bug면) 우선순위 → (후보가 있으면) 중복 판정 → 보고서 → 게시
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: triage-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  # 에이전트 코드 버전. 게시기(개발 저장소 PR #29)가 main에 병합되면 main 커밋으로 바꾼다.
  AGENT_REPOSITORY: Gosu0101/llm-github-triage-agent
  AGENT_REF: a86e1de36dc1b22f6ba80ea8b0f9faea4630d82c
  # 중복 비교 후보 이슈 번호. 비워 두면 중복 판정을 건너뛴다. 첫 시연 후보는 #1.
  DUPLICATE_CANDIDATE: '1'
  # 'true'일 때만 라벨·댓글을 실제로 게시한다. 그 전에는 미리보기만 로그에 남긴다.
  PUBLISH: 'false'

defaults:
  run:
    shell: bash

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 시연 저장소 스크립트 받기
        uses: actions/checkout@v6
        with:
          path: demo
          persist-credentials: false

      - name: 에이전트 코드 받기
        uses: actions/checkout@v6
        with:
          repository: ${{ env.AGENT_REPOSITORY }}
          ref: ${{ env.AGENT_REF }}
          path: agent
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 에이전트 설치
        run: |
          python -m pip install ./agent
          echo "agent commit: $(git -C agent rev-parse HEAD)"

      - name: 입력 만들기
        id: inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python demo/.github/scripts/build_inputs.py issue
          --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY"
          --candidate "$DUPLICATE_CANDIDATE" --output work/inputs

      - name: 분류·우선순위
        id: pipeline
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >-
          python -B -m triage_agent.triage_pipeline
          --inputs work/inputs/issues.json --execute --smoke --output work/pipeline

      - name: 중복 판정
        id: duplicate
        if: steps.inputs.outputs.has_candidate == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET: ${{ steps.inputs.outputs.target_item_id }}
          CANDIDATE: ${{ steps.inputs.outputs.candidate_item_id }}
        run: >-
          python -B -m triage_agent.duplicate_detection
          --inputs work/inputs/issues.json --target "$TARGET" --candidate "$CANDIDATE"
          --model gemini-3.8-flash --execute --output work/duplicate

      - name: 보고서 만들기
        run: |
          # 분석이 결과 폴더를 만들기 전에 실패해도 입력만으로 보고서를 남긴다 (있는 결과 폴더만 넘김)
          args=(--issue-inputs work/inputs/issues.json --output work/report)
          if [ -d work/pipeline/classification/results ]; then args+=(--classifications work/pipeline/classification/results); fi
          if [ -d work/pipeline/priority/results ]; then args+=(--priorities work/pipeline/priority/results); fi
          if [ -d work/duplicate/results ]; then args+=(--duplicates work/duplicate/results); fi
          python -B -m triage_agent.feature_report "${args[@]}"
          cat work/report/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 게시 미리보기
        id: preview
        continue-on-error: true
        env:
          NUMBER: ${{ github.event.issue.number }}
        run: >-
          python -B -m triage_agent.publish --report work/report/report.json
          --kind issue --number "$NUMBER" | tee work/publish-preview.json

      - name: 라벨·댓글 게시
        if: env.PUBLISH == 'true' && steps.preview.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: >-
          python -B -m triage_agent.publish --report work/report/report.json
          --kind issue --number "$NUMBER" --publish | tee work/publish-result.json

      - name: 실행 기록 보관
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: triage-issue-${{ github.event.issue.number }}-try${{ github.run_attempt }}
          path: work/
          if-no-files-found: ignore
          retention-days: 30

      - name: 분석 실패 확인
        if: >-
          steps.pipeline.outcome == 'failure' || steps.duplicate.outcome == 'failure'
          || steps.preview.outcome == 'failure'
        run: |
          echo "::error::분석 또는 미리보기 단계가 실패했습니다. 실패한 단계 로그와 보고서(Summary, work 폴더)를 확인하세요."
          exit 1
